<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTask - Gestión Unificada</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); min-height: 100vh; color: var(--text-primary); }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo i { font-size: 2.5rem; color: var(--primary); }
        h1 { font-size: 2rem; font-weight: 700; }
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-item { background: var(--bg-card); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid var(--border); }
        .stat-value { font-size: 2.5rem; font-weight: 700; margin-bottom: 5px; }
        .stat-pending .stat-value { color: var(--warning); }
        .stat-progress .stat-value { color: var(--info); }
        .stat-completed .stat-value { color: var(--success); }
        .stat-total .stat-value { color: var(--primary); }
        .kanban-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .kanban-column { background: var(--bg-card); border-radius: 15px; padding: 20px; min-height: 500px; border: 1px solid var(--border); }
        .column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border); }
        .column-title { font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .column-count { background: var(--bg-dark); padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; color: var(--text-secondary); }
        .column-pending .column-title { color: var(--warning); }
        .column-progress .column-title { color: var(--info); }
        .column-completed .column-title { color: var(--success); }
        .kanban-card { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 15px; cursor: grab; transition: all 0.3s; }
        .kanban-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px; }
        .card-title { font-weight: 600; font-size: 1rem; line-height: 1.4; }
        .card-priority { padding: 3px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
        .priority-high { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .priority-medium { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .priority-low { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .card-assignee { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; background: rgba(99, 102, 241, 0.2); color: var(--primary); border-radius: 12px; font-size: 0.75rem; margin-top: 10px; }
        .add-task-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); border: none; color: white; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4); transition: all 0.3s; }
        .add-task-btn:hover { transform: scale(1.1); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-card); border-radius: 20px; padding: 30px; width: 90%; max-width: 500px; border: 1px solid var(--border); }
        input, textarea, select { width: 100%; padding: 15px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 10px; color: var(--text-primary); margin-bottom: 15px; font-family: inherit; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 15px 30px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; width: 100%; }
        .btn-small { padding: 8px 16px; font-size: 0.85rem; margin-right: 5px; }
        .btn-success { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .btn-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .sync-indicator { position: fixed; bottom: 30px; left: 30px; padding: 12px 20px; background: var(--bg-card); border-radius: 25px; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); }
        .sync-indicator.synced { color: var(--success); }
        @media (max-width: 968px) { .kanban-board { grid-template-columns: 1fr; } .stats-bar { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-tasks"></i>
                <div>
                    <h1>ProTask</h1>
                    <small style="color: var(--text-secondary);">Gestión Unificada</small>
                </div>
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat-item stat-pending">
                <div class="stat-value" id="pendingCount">0</div>
                <div class="stat-label">Pendientes</div>
            </div>
            <div class="stat-item stat-progress">
                <div class="stat-value" id="progressCount">0</div>
                <div class="stat-label">En Progreso</div>
            </div>
            <div class="stat-item stat-completed">
                <div class="stat-value" id="completedCount">0</div>
                <div class="stat-label">Completadas</div>
            </div>
            <div class="stat-item stat-total">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Total</div>
            </div>
        </div>

        <div class="kanban-board">
            <div class="kanban-column column-pending">
                <div class="column-header">
                    <span class="column-title"><i class="fas fa-clock"></i> Pendientes</span>
                    <span class="column-count" id="count-pending">0</span>
                </div>
                <div id="list-pending"></div>
            </div>
            <div class="kanban-column column-progress">
                <div class="column-header">
                    <span class="column-title"><i class="fas fa-spinner"></i> En Progreso</span>
                    <span class="column-count" id="count-progress">0</span>
                </div>
                <div id="list-progress"></div>
            </div>
            <div class="kanban-column column-completed">
                <div class="column-header">
                    <span class="column-title"><i class="fas fa-check-circle"></i> Completadas</span>
                    <span class="column-count" id="count-completed">0</span>
                </div>
                <div id="list-completed"></div>
            </div>
        </div>
    </div>

    <button class="add-task-btn" onclick="openModal()">
        <i class="fas fa-plus"></i>
    </button>

    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h3>Nueva Tarea</h3>
                <button onclick="closeModal()" style="background:none;border:none;color:var(--text-secondary);font-size:1.5rem;cursor:pointer;">&times;</button>
            </div>
            <form id="taskForm">
                <input type="text" id="taskTitle" placeholder="Título de la tarea" required>
                <textarea id="taskDescription" placeholder="Descripción..." rows="3"></textarea>
                <div class="form-row">
                    <select id="taskPriority">
                        <option value="high">Alta</option>
                        <option value="medium" selected>Media</option>
                        <option value="low">Baja</option>
                    </select>
                    <select id="taskAssignee">
                        <option value="me" selected>Para Mí</option>
                        <option value="gene">Para Genee 🤖</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Crear Tarea</button>
            </form>
        </div>
    </div>

    <div class="sync-indicator synced" id="syncStatus">
        <i class="fas fa-check-circle"></i> <span>Sincronizado</span>
    </div>

    <script>
        // Seed data with migrated tasks
        const seedTasks = [
            {
                id: 'task-001',
                title: '🎨 Mejorar diseño visual de ProTask con estilo Kanban',
                description: 'Ir mejorando cómo se ven las tareas de ProTask, quizás haciendo un Kanban orientado al flujo de trabajo',
                priority: 'high',
                status: 'completed',
                assignee: 'gene',
                notes: '✅ Implementado tablero Kanban con 3 columnas\n✅ Diseño moderno tipo Trello\n✅ Asignación de tareas (Tú/Genee)\n✅ Migración de tareas completada',
                createdAt: '2026-02-15T09:09:00Z',
                updatedAt: '2026-02-15T16:00:00Z'
            },
            {
                id: 'task-002',
                title: '📊 Crear Plan de Negocios para Serviclima El Muñoz',
                description: 'Plan de negocios profesional para presentar a inversionistas. Incluye proyecciones financieras, análisis de mercado, ROI y estructura de participación.',
                priority: 'high',
                status: 'completed',
                assignee: 'gene',
                notes: '✅ Plan de negocios completo creado\n✅ Proyecciones financieras 3 años\n✅ Inversión total: $275,800 MXN\n✅ ROI Año 1: 46.4%\n✅ Repositorio: github.com/gutnber/serviclima-plan-negocios',
                createdAt: '2026-02-15T07:15:00Z',
                updatedAt: '2026-02-15T08:30:00Z'
            },
            {
                id: 'task-003',
                title: '📖 Configurar mensaje diario 9 AM con versículo bíblico',
                description: 'Configurar cron job para enviar mensaje diario a las 9 AM con versículo bíblico y reflexión a Alex vía WhatsApp',
                priority: 'high',
                status: 'completed',
                assignee: 'gene',
                notes: '✅ Configurado cron job\n✅ Primer mensaje enviado exitosamente (Proverbios 3:5-6)\n✅ Horario: 9:00 AM America/Mexico_City',
                createdAt: '2026-02-15T02:09:00Z',
                updatedAt: '2026-02-15T09:00:00Z'
            },
            {
                id: 'task-004',
                title: '🤖 Crear Gene Task Manager - App de tareas para Genee',
                description: 'App para gestionar tareas asignadas a Genee con historial y seguimiento',
                priority: 'high',
                status: 'completed',
                assignee: 'gene',
                notes: '✅ App creada con diseño profesional\n✅ Integrado en ProTask unificado\n✅ Tareas migradas exitosamente',
                createdAt: '2026-02-14T23:23:00Z',
                updatedAt: '2026-02-15T16:10:00Z'
            }
        ];

        const STORAGE_KEY = 'protasks_v2';
        let tasks = [];

        function initStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {
                tasks = [...seedTasks];
                saveTasks();
            } else {
                tasks = JSON.parse(saved);
            }
        }

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function openModal() {
            document.getElementById('taskModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
        }

        document.getElementById('taskForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newTask = {
                id: 'task-' + Date.now(),
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDescription').value,
                priority: document.getElementById('taskPriority').value,
                assignee: document.getElementById('taskAssignee').value,
                status: 'pending',
                notes: '',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            tasks.push(newTask);
            saveTasks();
            renderTasks();
            document.getElementById('taskForm').reset();
            closeModal();
        });

        window.moveTask = (id, newStatus) => {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.status = newStatus;
                task.updatedAt = new Date().toISOString();
                saveTasks();
                renderTasks();
            }
        };

        window.deleteTask = (id) => {
            if (confirm('¿Eliminar esta tarea?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
            }
        };

        function renderTasks() {
            const pending = tasks.filter(t => t.status === 'pending');
            const progress = tasks.filter(t => t.status === 'progress');
            const completed = tasks.filter(t => t.status === 'completed');

            document.getElementById('list-pending').innerHTML = pending.map(task => renderCard(task)).join('');
            document.getElementById('list-progress').innerHTML = progress.map(task => renderCard(task)).join('');
            document.getElementById('list-completed').innerHTML = completed.map(task => renderCard(task)).join('');

            document.getElementById('count-pending').textContent = pending.length;
            document.getElementById('count-progress').textContent = progress.length;
            document.getElementById('count-completed').textContent = completed.length;

            document.getElementById('pendingCount').textContent = pending.length;
            document.getElementById('progressCount').textContent = progress.length;
            document.getElementById('completedCount').textContent = completed.length;
            document.getElementById('totalCount').textContent = tasks.length;
        }

        function renderCard(task) {
            const assigneeIcon = task.assignee === 'gene' ? '🤖' : '👤';
            const assigneeName = task.assignee === 'gene' ? 'Genee' : 'Tú';
            
            let actions = '';
            if (task.status === 'pending') {
                actions = `<button class="btn btn-warning btn-small" onclick="moveTask('${task.id}', 'progress')"><i class="fas fa-play"></i> Iniciar</button>`;
            } else if (task.status === 'progress') {
                actions = `<button class="btn btn-success btn-small" onclick="moveTask('${task.id}', 'completed')"><i class="fas fa-check"></i> Completar</button>`;
            }
            
            return `
                <div class="kanban-card">
                    <div class="card-header">
                        <span class="card-title">${escapeHtml(task.title)}</span>
                        <span class="card-priority priority-${task.priority}">${task.priority}</span>
                    </div>
                    ${task.description ? `<p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:10px;">${escapeHtml(task.description)}</p>` : ''}
                    ${task.notes ? `<div style="background:rgba(99,102,241,0.1);padding:10px;border-radius:8px;margin-bottom:10px;font-size:0.85rem;color:var(--text-secondary);white-space:pre-line;">${escapeHtml(task.notes)}</div>` : ''}
                    <div class="card-assignee">${assigneeIcon} ${assigneeName}</div>
                    <div style="margin-top:10px;display:flex;gap:10px;">
                        ${actions}
                        <button class="btn btn-danger btn-small" onclick="deleteTask('${task.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        initStorage();
        renderTasks();
    </script>
</body>
</html>
